name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - run: npm ci
      - run: npm run build

      - name: Verify build output
        run: |
          test -f main.js
          node -e "const m=require('./manifest.json');if(m.version!=='${GITHUB_REF_NAME}'){throw new Error('manifest version '+m.version+' != tag '+process.env.GITHUB_REF_NAME)}"

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" --title="$tag" --notes="$tag" \
            main.js manifest.json styles.css
